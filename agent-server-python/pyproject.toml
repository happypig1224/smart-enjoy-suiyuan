[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suiyuan-agent-server"
version = "1.0.0"
description = "智享绥园 AI Agent 服务 - 基于 LangGraph + Milvus + MCP 协议"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Suiyuan Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi==0.109.2",
    "uvicorn[standard]==0.27.1",
    "pydantic==2.6.1",
    "pydantic-settings==2.1.0",
    "pyyaml==6.0.1",
    "langgraph==0.0.26",
    "langchain>=0.1.20,<0.2.0",
    "langchain-core>=0.1.30,<0.2.0",
    "langchain-community>=0.0.30,<0.1.0",
    "dashscope>=1.14.0,<1.20.0",
    "pymilvus>=2.4.0,<2.5.0",
    "httpx==0.25.2",
    "apscheduler==3.10.4",
    "python-dotenv==1.0.1",
    "numpy<2,>=1",
    "setuptools<70",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "isort>=5.0.0",
    "flake8>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3
